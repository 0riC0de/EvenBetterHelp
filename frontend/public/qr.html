<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <title>WhatsApp Web QR Scan - EvenBetterHelp</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111b21;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: #202c33;
      padding: 2.5rem;
      border-radius: 1.25rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      max-width: 480px;
      width: 100%;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
      color: #00a884;
    }
    p.sub {
      margin: 0 0 1.5rem;
      color: #8696a0;
      font-size: 0.95rem;
    }
    .qr-frame {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      display: inline-block;
      margin: 0 auto 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    img#qr {
      display: block;
      width: 300px;
      height: 300px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      object-fit: contain;
    }
    .instructions {
      text-align: left;
      background: #111b21;
      padding: 1.2rem 1.5rem;
      border-radius: 0.75rem;
      margin-bottom: 1.2rem;
    }
    .instructions ol {
      margin: 0;
      padding-left: 1.2rem;
      line-height: 1.8;
      color: #d1d7db;
      font-size: 0.95rem;
    }
    .instructions b {
      color: #00a884;
    }
    .status {
      font-size: 0.85rem;
      color: #8696a0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00a884;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class=container>
    <h1>Scan WhatsApp QR Code</h1>
    <p class=sub>Link your personal WhatsApp account</p>

    <div class=qr-frame>
      <img id=qr src=/pairing.jpg alt=WhatsApp Pairing QR Code />
    </div>

    <div class=instructions>
      <ol>
        <li>Open <b>WhatsApp</b> on your phone</li>
        <li>Go to <b>Settings</b> &rarr; <b>Linked devices</b></li>
        <li>Tap <b>Link a device</b></li>
        <li>Point your camera steadily at the QR code above</li>
      </ol>
    </div>

    <div class=status>
      <span class=dot></span>
      <span id=statustext>Live connection active &bull; auto-refreshing</span>
    </div>
  </div>

  <script>
    const qrImg = document.getElementById('qr');
    setInterval(() => {
      qrImg.src = '/pairing.jpg?t=' + Date.now();
    }, 2500);
  </script>
</body>
</html>
